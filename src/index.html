<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="Content-Security-Policy" 
      content="default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data:;">
    <title>Omega HH42 Device</title>
    <link rel="stylesheet" href="output.css" />
    <script src="plotly.min.js"></script>
  </head>
  <body>
    <div class="mx-auto max-w-screen-lg">
      <h1 class="text-2xl font-bold mb-4">Omega HH42 Device</h1>
      <select id="portSelect" class="w-full mb-4"></select>
      <button id="setFahrenheit" class="bg-green-500 text-white px-4 py-2 rounded mb-4">°F Mode</button>
      <button id="setCelsius" class="bg-green-500 text-white px-4 py-2 rounded mb-4">°C Mode</button>
      <div id="reading"><span id="temperature"></span><span id="unit"></span></div>
      <div id="chart" class="w-full h-full"></div>
    </div>
    <script src="renderer.js"></script>
    <script src="chart.js"></script>
  </body>
</html>
