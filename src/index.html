<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta
            http-equiv="Content-Security-Policy"
            content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self' data: blob:;"
        />
        <title>Omega HH42 Thermometer</title>
        <link rel="stylesheet" href="output.css" />
        <script src="plotly.min.js"></script>
    </head>
    <body class="h-screen overflow-hidden bg-slate-900 text-slate-100">
        <!-- Update notification banner -->
        <div
            id="update-banner"
            class="fixed inset-x-0 top-0 z-50 hidden items-center justify-center gap-3 bg-blue-600 px-4 py-2 text-sm text-white shadow-lg"
        >
            <span id="update-message">A new update is available!</span>
            <button
                id="update-action-btn"
                class="no-drag hidden rounded bg-white px-3 py-1 text-xs font-semibold text-blue-600 transition-colors hover:bg-blue-50"
            >
                Download
            </button>
            <button
                id="update-dismiss-btn"
                class="no-drag rounded px-2 py-1 text-xs text-blue-200 transition-colors hover:text-white"
            >
                Dismiss
            </button>
        </div>

        <!-- Draggable strip; only inset on macOS where the caption bar is hidden -->
        <div class="draggable mac-only fixed inset-x-0 top-0 h-7 bg-slate-950"></div>

        <main class="flex h-full flex-col gap-4 p-4 mac-inset">
            <div
                class="flex flex-1 flex-col overflow-hidden rounded-xl bg-slate-800 p-6 shadow-xl ring-1 ring-slate-700/50"
            >
                <header
                    class="mb-5 flex flex-wrap items-center justify-between gap-4"
                >
                    <div>
                        <h1 class="text-2xl font-bold text-red-500">
                            Omega HH42
                        </h1>
                        <div
                            class="mt-1 flex items-center gap-2 text-sm text-slate-400"
                        >
                            <span
                                id="status-dot"
                                class="h-2.5 w-2.5 shrink-0 rounded-full bg-slate-500"
                            ></span>
                            <span id="status-text" class="truncate"
                                >Starting...</span
                            >
                        </div>
                    </div>

                    <div
                        class="flex items-baseline gap-1 rounded-lg bg-slate-900/80 px-5 py-3"
                    >
                        <span
                            id="temperature"
                            class="text-4xl font-bold tabular-nums text-red-400"
                            >--</span
                        >
                        <span id="unit" class="text-xl text-slate-400">°C</span>
                    </div>
                </header>

                <!-- Controls -->
                <div class="mb-5 flex flex-wrap items-center gap-x-4 gap-y-3">
                    <div class="flex items-center gap-2">
                        <label
                            for="portSelect"
                            class="text-sm font-medium text-slate-400"
                        >
                            Port
                        </label>
                        <select
                            id="portSelect"
                            class="no-drag max-w-[18rem] cursor-pointer truncate rounded-lg border border-slate-600 bg-slate-700 px-3 py-2 text-sm text-slate-100 transition-colors hover:border-slate-500 focus:border-blue-500 focus:outline-none focus:ring-2 focus:ring-blue-500/20"
                        ></select>
                        <button
                            id="refresh-ports-button"
                            class="no-drag rounded-lg p-2 text-slate-400 transition-colors hover:bg-slate-700 hover:text-white focus:outline-none focus:ring-2 focus:ring-slate-500/50"
                            title="Refresh port list"
                        >
                            <svg
                                class="h-5 w-5"
                                fill="none"
                                stroke="currentColor"
                                viewBox="0 0 24 24"
                            >
                                <path
                                    stroke-linecap="round"
                                    stroke-linejoin="round"
                                    stroke-width="2"
                                    d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"
                                />
                            </svg>
                        </button>
                    </div>

                    <div class="h-6 w-px bg-slate-700"></div>

                    <!-- Database logging is opt-in -->
                    <div class="flex items-center gap-2">
                        <button
                            id="log-toggle"
                            class="no-drag rounded-lg bg-emerald-600 px-4 py-2 text-sm font-medium text-white transition-all hover:bg-emerald-500 focus:outline-none focus:ring-2 focus:ring-emerald-500/50"
                        >
                            Start Logging
                        </button>
                        <span
                            id="log-indicator"
                            class="hidden h-2.5 w-2.5 animate-pulse rounded-full bg-red-500"
                            title="Recording to database"
                        ></span>
                        <label
                            for="log-interval"
                            class="ml-1 text-sm font-medium text-slate-400"
                        >
                            every
                        </label>
                        <select
                            id="log-interval"
                            class="no-drag cursor-pointer rounded-lg border border-slate-600 bg-slate-700 px-3 py-2 text-sm text-slate-100 transition-colors hover:border-slate-500 focus:border-blue-500 focus:outline-none focus:ring-2 focus:ring-blue-500/20"
                        ></select>
                    </div>

                    <button
                        id="db-view-button"
                        class="no-drag ml-auto rounded-lg bg-blue-600 px-4 py-2 text-sm font-medium text-white transition-all hover:bg-blue-500 focus:outline-none focus:ring-2 focus:ring-blue-500/50"
                    >
                        View Data
                    </button>
                </div>

                <div
                    class="min-h-0 flex-1 overflow-hidden rounded-lg bg-slate-700/50 p-2"
                >
                    <div id="chart" class="h-full w-full"></div>
                </div>
            </div>
        </main>

        <!-- Data modal -->
        <div
            id="db-table-container-modal"
            class="fixed inset-0 z-50 hidden bg-black/60 opacity-0 backdrop-blur-sm transition-opacity duration-300"
        >
            <div class="flex min-h-screen items-center justify-center p-4">
                <div
                    class="relative w-full max-w-4xl rounded-xl bg-slate-800 p-6 shadow-2xl ring-1 ring-slate-700/50"
                >
                    <button
                        id="modal-close"
                        class="absolute right-4 top-4 rounded-lg p-1 text-slate-400 transition-colors hover:bg-slate-700 hover:text-white"
                        title="Close"
                    >
                        <svg
                            class="h-6 w-6"
                            fill="none"
                            stroke="currentColor"
                            viewBox="0 0 24 24"
                        >
                            <path
                                stroke-linecap="round"
                                stroke-linejoin="round"
                                stroke-width="2"
                                d="M6 18L18 6M6 6l12 12"
                            />
                        </svg>
                    </button>

                    <div class="mb-6">
                        <h2 class="text-xl font-semibold text-slate-100">
                            Temperature Data
                        </h2>
                        <p class="mt-1 text-sm text-slate-400">
                            Readings saved to the local SQLite database
                        </p>
                    </div>

                    <div class="mb-4 flex flex-wrap items-center gap-4">
                        <button
                            id="db-export-button"
                            class="rounded-lg bg-emerald-600 px-4 py-2 text-sm font-medium text-white transition-all hover:bg-emerald-500 focus:outline-none focus:ring-2 focus:ring-emerald-500/50 disabled:opacity-50"
                        >
                            Export CSV
                        </button>
                        <button
                            id="db-reset-button"
                            class="rounded-lg bg-red-600 px-4 py-2 text-sm font-medium text-white transition-all hover:bg-red-500 focus:outline-none focus:ring-2 focus:ring-red-500/50"
                        >
                            Delete All
                        </button>
                        <span
                            id="db-record-count"
                            class="text-sm text-slate-400"
                        ></span>
                    </div>

                    <p id="db-note" class="mb-3 min-h-[1rem] break-all text-xs text-slate-400"></p>

                    <div
                        class="max-h-[60vh] overflow-auto rounded-lg bg-slate-900/50"
                    >
                        <table
                            id="db-table"
                            class="w-full text-left text-sm text-slate-300"
                        ></table>
                    </div>
                </div>
            </div>
        </div>

        <script type="module" src="renderer.js"></script>
    </body>
</html>
