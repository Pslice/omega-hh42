name: Build and release

# Native modules mean each platform's installer has to be produced on that
# platform - and, on macOS, on that architecture. Building a Windows installer
# from a Mac packages macOS .node binaries, and building an x64 Mac bundle on
# Apple Silicon packages an arm64 sqlite3 that dies the moment the database is
# opened. So every target gets its own native runner.
on:
  push:
    tags:
      - 'v*'
  # Lets the matrix be exercised without cutting a release. Artifacts are
  # uploaded to the workflow run instead of a GitHub release.
  workflow_dispatch:

# electron-builder creates the release and uploads to it.
permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      # One platform failing should not hide whether the others are healthy.
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-latest
            script: dist:win
          - name: macOS arm64
            os: macos-14
            script: dist:mac
          # Intel Mac. Not macos-13: that image has been retired, and a job
          # requesting it is never assigned a runner - it sits queued while
          # every other label starts instantly, then times out.
          - name: macOS x64
            os: macos-15-intel
            script: dist:mac
          - name: Linux x64
            os: ubuntu-latest
            script: dist:linux

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # npm ci, not npm install: the lockfile pins node-gyp to 11 via an
      # override, without which any native rebuild fails on Python 3.12+.
      - run: npm ci

      - run: npm test

      - name: Build${{ startsWith(github.ref, 'refs/tags/v') && ' and publish' || '' }}
        run: npm run ${{ matrix.script }} -- --publish ${{ startsWith(github.ref, 'refs/tags/v') && 'always' || 'never' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload artifacts
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: |
            dist/*.exe
            dist/*.dmg
            dist/*.zip
            dist/*.AppImage
            dist/*.deb
          if-no-files-found: error
