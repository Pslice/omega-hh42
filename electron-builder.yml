appId: com.patrickcool.omegahh42
productName: OmegaHH42
copyright: Copyright © 2026 Patrick Cool

directories:
  buildResources: build
  output: dist

# Ad-hoc signs the macOS app, which packaging leaves with an invalid signature.
# See the comments in the script itself.
afterPack: build/after-pack.js

files:
  - src/**/*
  - package.json
  # Build inputs that the packaged app never reads.
  - '!src/input.css'
  - '!src/temperatures.db'

# serialport and sqlite3 load .node binaries at runtime, which cannot be read
# from inside app.asar. These must stay unpacked or the app throws
# "Cannot find module" on first serial/database access in a packaged build.
asarUnpack:
  - node_modules/serialport/**
  - node_modules/@serialport/**
  - node_modules/sqlite3/**
  - node_modules/bindings/**
  - node_modules/file-uri-to-path/**
  - node_modules/node-addon-api/**
  - node_modules/node-gyp-build/**

# Both native dependencies ship N-API prebuilds, which are ABI-stable across
# Node and Electron versions: @serialport/bindings-cpp carries a universal
# darwin-x64+arm64 binary, and sqlite3 declares napi_versions [3, 6] and
# fetches a per-arch prebuild during install. Rebuilding them from source is
# therefore pure risk - on macOS @electron/rebuild's node-gyp worker hung
# indefinitely on the serialport step - so use what npm installed.
#
# This is only safe because each platform's installer is built on that
# platform (see README): a cross-arch build would package the host's binary.
npmRebuild: false

win:
  executableName: OmegaHH42
  icon: src/icon.ico
  target:
    - target: nsis
      arch:
        - x64

nsis:
  artifactName: ${name}-${version}-setup.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  # The temperature database lives in %APPDATA%; keep it across upgrades and
  # uninstalls so a reinstall does not silently discard logged data.
  deleteAppDataOnUninstall: false

mac:
  icon: src/icon.icns
  category: public.app-category.utilities
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  target:
    # zip alongside dmg: electron-updater cannot apply a differential update
    # from a dmg, so omitting it breaks auto-update on macOS.
    #
    # arch is deliberately not pinned. With npmRebuild disabled the packaged
    # native modules are whatever npm installed for *this* machine, so listing
    # [x64, arm64] made an Apple Silicon host emit an x64 bundle containing an
    # arm64 sqlite3 - which crashes on first database access, i.e. at startup.
    # Defaulting to the host arch keeps binaries and bundle in agreement; CI
    # builds each arch on its own native runner.
    - target: dmg
    - target: zip

linux:
  icon: src/icon.png
  category: Utility
  synopsis: Omega HH42 thermocouple thermometer interface
  target:
    - target: AppImage
      arch: [x64]
    - target: deb
      arch: [x64]

publish:
  provider: github
  owner: Pslice
  repo: omega-hh42
